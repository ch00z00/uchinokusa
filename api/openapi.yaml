# uchinokusa の API 定義。サーバーとアプリの取り決めの唯一の正（docs/decisions/0001）。
# 変更したら、リポジトリのルートで `make gen-api` を実行して、両方の型を生成し直す。
openapi: 3.1.0
info:
  title: uchinokusa API
  version: 0.1.0
  description: |
    家族で共有できる室内観葉植物の管理アプリ（uchinokusa）の API。

    ## 表現のルール
    - JSON の項目名はキャメルケースとする
    - 日付は `YYYY-MM-DD`（`Date`）、日時は RFC 3339 の UTC（`DateTime`、例：`2026-10-26T09:30:00Z`）とする
    - エラーは、どのステータスでも `Error` の形で返す。アプリは `code` で分岐し、`message` は画面に表示しない

    ## 互換性のルール（要件19-9）
    - この定義には、項目・列挙値・エンドポイントの**追加だけ**を行う。削除や意味の変更は `/v2` で行う
    - アプリは、知らない項目を無視する。知らない列挙値（エラーの `code` を含む）は「不明」として扱い、エラーにしない
    - そのため、レスポンスのスキーマには `additionalProperties: false` を付けない
    - サーバーも、リクエストの知らない項目を無視する（新しいアプリから古いサーバーへのリクエストを受け付けるため）

servers:
  - url: /v1

# すべてのエンドポイントで、Firebase の ID トークンが必要（要件1-3）
security:
  - firebaseIdToken: []

paths:
  /me:
    get:
      operationId: getMe
      summary: 自分のプロフィールを取得する
      description: 初めてアクセスしたユーザーの場合は、認証プロバイダから受け取った名前を表示名の初期値にして、ユーザーを作る
      tags: [account]
      responses:
        "200":
          description: 自分のプロフィール
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateMe
      summary: 自分の表示名を変更する
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: 変更後のプロフィール
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /me/devices:
    post:
      operationId: registerDevice
      summary: プッシュ通知の送信先となる端末を登録・更新する
      description: |
        アプリの起動時と、FCM トークンが変わったときに呼ぶ。同じ `fcmToken` の端末がすでにあれば、
        その端末の OS の種類・タイムゾーンを更新する（要件15-7）。
        別のユーザーで登録されていた場合は、リクエストしたユーザーの端末に付け替える（1台の端末で、ユーザーを切り替えた場合）。
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "200":
          description: 登録・更新した端末。`id` はサインアウト時の解除に使うため、アプリに保存する
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /me/devices/{deviceId}:
    delete:
      operationId: unregisterDevice
      summary: 端末をプッシュ通知の送信先から外す
      description: |
        サインアウトの前に呼ぶ（要件1-5）。自分の端末でない場合や、すでに外れている場合も 204 を返す
        （サインアウトを止めないため。ほかのユーザーの端末の有無も明かさない）。
      tags: [account]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 外した（または、もともと送信先ではなかった）
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

  /households:
    get:
      operationId: listHouseholds
      summary: 所属するすべての世帯を、自分のロールとともに返す
      tags: [household]
      responses:
        "200":
          description: 所属する世帯（作成の古い順）。どこにも所属していなければ空の配列
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createHousehold
      summary: 世帯を作成し、作成したユーザーをオーナーにする
      tags: [household]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHouseholdRequest" }
      responses:
        "201":
          description: 作成した世帯（`role` は `owner`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    patch:
      operationId: updateHousehold
      summary: 世帯名・地域を変更する（オーナーのみ）
      description: 送った項目だけを変更する。地域を未設定に戻すには、空文字を送る
      tags: [household]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHouseholdRequest" }
      responses:
        "200":
          description: 変更後の世帯
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteHousehold
      summary: 世帯を削除する（オーナーのみ）
      description: 植物・タスク・記録・メモ・招待など、世帯の配下のデータもすべて削除する。元に戻せないため、アプリで確認してから呼ぶ（要件2-6）
      tags: [household]
      responses:
        "204":
          description: 削除した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/members:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listMembers
      summary: 世帯のメンバーの一覧
      tags: [member]
      responses:
        "200":
          description: メンバー（参加の古い順）
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMemberRole
      summary: メンバーのロールを変更する（オーナーのみ）
      description: |
        `owner` は指定できない（オーナーの交代は ownership-transfer で行う）。
        オーナー自身のロールは変えられない（`409 last_owner`）
      tags: [member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRoleRequest" }
      responses:
        "200":
          description: 変更後のメンバー
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: removeMember
      summary: メンバーを世帯から外す（自分なら退出）
      description: |
        `userId` が自分なら退出、ほかの人ならオーナーによる削除になる。
        オーナーは退出できない（`409 last_owner`）。ほかにメンバーがいれば先にオーナー権限を移し、自分だけなら世帯を削除する（要件2-8）。
        外れたメンバーの過去の記録は、作業者名を残したまま保持する（要件4-7）
      tags: [member]
      responses:
        "204":
          description: 外した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/ownership-transfer:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: transferOwnership
      summary: オーナー権限を別のメンバーに移す（オーナーのみ）
      description: 移した先のメンバーがオーナーになり、元のオーナーは編集者になる（要件4-8）
      tags: [member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnershipRequest" }
      responses:
        "204":
          description: 移した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/members/me/notification-settings:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getNotificationSettings
      summary: この世帯での自分の通知設定を取得する
      tags: [member]
      responses:
        "200":
          description: 通知設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateNotificationSettings
      summary: この世帯での自分の通知設定を変更する（閲覧者も変更できる）
      tags: [member]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: 変更後の通知設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listInvitations
      summary: 有効な招待の一覧（オーナーのみ）
      description: 取り消されておらず、期限が切れていない招待を、新しい順に返す。招待リンクの URL は作成時にしか返せない（トークンを保存しないため）ので、ここには含まない
      tags: [invitation]
      responses:
        "200":
          description: 有効な招待
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createInvitation
      summary: 招待を作成する（オーナーのみ）
      description: 有効期限は作成から7日。期限内は複数人が使える（要件3-1）
      tags: [invitation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: 作成した招待と、招待リンクの URL。URL はこのレスポンスでしか受け取れない
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeInvitation
      summary: 招待を取り消す（オーナーのみ）
      description: 取り消した招待は、ただちに使えなくなる（要件3-7）。すでに取り消し済み・期限切れでも 204 を返す
      tags: [invitation]
      responses:
        "204":
          description: 取り消した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /invitations/{tokenOrCode}:
    parameters:
      - $ref: "#/components/parameters/TokenOrCode"
    get:
      operationId: getInvitation
      summary: 招待の内容（世帯名と付与されるロール）を取得する
      description: |
        参加の確認画面に使う（要件3-3）。期限切れ・取り消し済み・存在しない招待は、区別せずに `410 invitation_invalid` を返す。
        利用者ごとにレート制限があり、超えると `429 rate_limited` を返す
      tags: [invitation]
      responses:
        "200":
          description: 招待の内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }

  /invitations/{tokenOrCode}/accept:
    parameters:
      - $ref: "#/components/parameters/TokenOrCode"
    post:
      operationId: acceptInvitation
      summary: 招待を受けて、世帯に参加する
      description: |
        招待のロールで世帯に追加し、オーナーへの通知を予約する（要件3-3・3-8）。
        すでにメンバーなら `409 already_member`（重複して追加しない。要件3-6）、無効な招待なら `410 invitation_invalid`
      tags: [invitation]
      responses:
        "200":
          description: 参加した世帯（`role` は招待のロール）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/locations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listLocations
      summary: 世帯の置き場所の一覧
      description: 作成の古い順に返す。閲覧者も見られる
      tags: [location]
      responses:
        "200":
          description: 世帯の置き場所。1つもなければ空の配列
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createLocation
      summary: 置き場所を作成する（編集者以上）
      tags: [location]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLocationRequest" }
      responses:
        "201":
          description: 作成した置き場所
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        description: 置き場所の ID。所属していない世帯の置き場所の場合は 404 を返す（存在を明かさない）
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLocation
      summary: 置き場所を変更する（編集者以上）
      description: 送った項目だけを変更する。環境の項目を未設定に戻すには、空文字を送る。変更は、置き場所に紐づくすべての植物に反映される（要件7-3）
      tags: [location]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLocationRequest" }
      responses:
        "200":
          description: 変更後の置き場所
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteLocation
      summary: 置き場所を削除する（編集者以上）
      description: |
        紐づく植物は削除せず、「置き場所未設定」にする（アーカイブした植物も含む）。
        アプリは、一覧の `plantCount` を示して確認してから呼ぶ（要件7-4）
      tags: [location]
      responses:
        "204":
          description: 削除した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /households/{householdId}/plants:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listPlants
      summary: 世帯の植物の一覧
      description: |
        登録の古い順に返す。閲覧者も見られる。株数に上限はない（要件5-3）。
        既定では、アーカイブした植物を含めない（要件5-8）
      tags: [plant]
      parameters:
        - name: locationId
          in: query
          required: false
          description: 置き場所で絞り込む（要件5-5）
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: |
            名前の部分一致で探す（要件5-5）。植物マスタの検索と同じく、ひらがな・カタカナ、全角・半角、大文字・小文字を区別せず、空白と中黒（・）を無視する。
            100文字まで（長すぎる場合は `fields.q = too_long`）
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: "`true` なら、アーカイブした植物だけを返す（記録やメモを見返すため）"
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 条件に合う植物。1つもなければ空の配列
          content:
            application/json:
              schema:
                type: object
                required: [plants]
                properties:
                  plants:
                    type: array
                    items: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createPlant
      summary: 植物を登録する（編集者以上）
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlantRequest" }
      responses:
        "201":
          description: 登録した植物
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /plants/{plantId}:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      operationId: getPlant
      summary: 植物の詳細
      description: 閲覧者も見られる。アーカイブした植物も見られる（記録とメモを閲覧するため。要件5-8）
      tags: [plant]
      responses:
        "200":
          description: 植物
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    patch:
      operationId: updatePlant
      summary: 植物の情報を変更する（編集者以上）
      description: 送った項目だけを変更する。種類・置き場所・購入日を未設定に戻すには、空文字を送る（要件5-6）
      tags: [plant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePlantRequest" }
      responses:
        "200":
          description: 変更後の植物
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deletePlant
      summary: 植物を削除する（編集者以上）
      description: |
        植物のタスク・記録・メモもいっしょに削除し、元に戻せない。
        アプリは、関連データも消えることを示して確認してから呼ぶ（要件5-7）。残したい場合はアーカイブを使う
      tags: [plant]
      responses:
        "204":
          description: 削除した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /plants/{plantId}/archive:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: archivePlant
      summary: 植物を「枯れた・手放した」としてアーカイブする（編集者以上）
      description: |
        通常の一覧とリマインダーの対象から外し、記録とメモは閲覧できるように残す（要件5-8）。
        すでにアーカイブしている場合は、最初にアーカイブした日時のまま返す
      tags: [plant]
      responses:
        "200":
          description: アーカイブした植物
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /plants/{plantId}/unarchive:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: unarchivePlant
      summary: アーカイブを元に戻す（編集者以上）
      description: 誤ってアーカイブしたときのためにある。アーカイブしていない場合は、そのまま返す
      tags: [plant]
      responses:
        "200":
          description: 元に戻した植物
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /plants/{plantId}/tasks:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      operationId: listCareTasks
      summary: 植物のお手入れタスクの一覧
      description: 削除していないタスク（一時停止中を含む）を、作成の古い順に返す。閲覧者も見られる
      tags: [task]
      responses:
        "200":
          description: 植物のタスク。1つもなければ空の配列
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/CareTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createCareTask
      summary: お手入れタスクを作成する（編集者以上）
      description: 1つの植物に、種類の異なる複数のタスクを作れる（要件8-2）。同じ種類のタスクを複数作ることもできる
      tags: [task]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCareTaskRequest" }
      responses:
        "201":
          description: 作成したタスク
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /plants/{plantId}/task-defaults:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      operationId: listCareTaskDefaults
      summary: タスクの作成画面の初期値
      description: |
        植物が植物マスタと紐づき、マスタにお手入れの目安がある場合、作業の種類ごとの初期値を返す（要件6-4）。
        今は、出典で確かめた水やりの実行条件だけを返す（推奨周期はまだない）。閲覧者も見られる
      tags: [task]
      responses:
        "200":
          description: 作業の種類ごとの初期値。なければ空の配列
          content:
            application/json:
              schema:
                type: object
                required: [defaults]
                properties:
                  defaults:
                    type: array
                    items: { $ref: "#/components/schemas/CareTaskDefault" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        description: タスクの ID。所属していない世帯のタスク・削除したタスクの場合は 404 を返す
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCareTask
      summary: お手入れタスクを変更する（編集者以上）
      description: |
        送った項目だけを変更する（要件8-8）。作業の種類は変えられない。
        周期を変えても次回予定日は変えず、新しい周期は次に完了したときから使う。予定日も変えたい場合は `nextDueOn` を送る。
        `nextDueOn` を送ると、その予定日は季節の切り替えで計算し直す対象から外れる
      tags: [task]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCareTaskRequest" }
      responses:
        "200":
          description: 変更後のタスク
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteCareTask
      summary: お手入れタスクを削除する（編集者以上）
      description: タスクの過去の記録は、履歴として残す（要件8-10）
      tags: [task]
      responses:
        "204":
          description: 削除した
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /species:
    get:
      operationId: searchSpecies
      summary: 植物マスタを和名・学名・別名で検索する
      description: |
        部分一致で探す。ひらがな・カタカナ、全角・半角、大文字・小文字を区別せず、空白と中黒（・）を無視する（要件6-2）。
        和名で一致したものを先に、最大20件を返す。`q` が空なら、和名の順に20件を返す。
        見つからない種類は、植物の登録で自由入力できる（要件6-3）
      tags: [species]
      parameters:
        - name: q
          in: query
          required: false
          description: 検索語。100文字まで（長すぎる場合は `fields.q = too_long`）
          schema:
            type: string
      responses:
        "200":
          description: 一致した種類
          content:
            application/json:
              schema:
                type: object
                required: [species]
                properties:
                  species:
                    type: array
                    items: { $ref: "#/components/schemas/Species" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  parameters:
    TokenOrCode:
      name: tokenOrCode
      in: path
      required: true
      description: 招待リンクのトークン、または8文字の招待コード。コードは大文字・小文字を区別せず、空白とハイフンを無視する
      schema:
        type: string
    HouseholdId:
      name: householdId
      in: path
      required: true
      description: 世帯の ID。所属していない世帯の場合は 404 を返す（存在を明かさない）
      schema:
        type: string
        format: uuid
    PlantId:
      name: plantId
      in: path
      required: true
      description: 植物の ID。所属していない世帯の植物の場合は 404 を返す（存在を明かさない）
      schema:
        type: string
        format: uuid
  securitySchemes:
    firebaseIdToken:
      description: "Firebase Auth の ID トークン（`Authorization: Bearer <トークン>`）。期限が切れたら、アプリで更新して送り直す"
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Me:
      description: 自分のプロフィール
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          description: 世帯のメンバーに表示する名前。認証プロバイダから名前を受け取れなかった場合は空文字になる（アプリで設定を促す）
          type: string
        createdAt:
          $ref: "#/components/schemas/DateTime"

    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          description: 前後の空白を除いて1〜30文字。空の場合は `fields.displayName = required`、長すぎる場合は `too_long`
          type: string

    Role:
      description: 世帯でのロール。値は今後も追加されうるため、アプリは知らない値を「閲覧者」として扱う
      type: string
      enum: [owner, editor, viewer]

    Hemisphere:
      type: string
      enum: [north, south]

    Household:
      description: 世帯。`role` はリクエストしたユーザーのロール
      type: object
      required: [id, name, role, timeZone, hemisphere, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        regionPrefecture:
          description: 都道府県。未設定なら項目がない
          type: string
        regionCity:
          description: 市区町村。未設定なら項目がない
          type: string
        timeZone:
          description: 世帯の IANA タイムゾーン（現在は `Asia/Tokyo` 固定）
          type: string
        hemisphere:
          $ref: "#/components/schemas/Hemisphere"
        createdAt:
          $ref: "#/components/schemas/DateTime"

    CreateHouseholdRequest:
      type: object
      required: [name]
      properties:
        name:
          description: 前後の空白を除いて1〜30文字。空の場合は `fields.name = required`、長すぎる場合は `too_long`
          type: string
        regionPrefecture:
          description: 任意。前後の空白を除いて50文字まで（`too_long`）。空文字は未設定として扱う
          type: string
        regionCity:
          description: 任意。前後の空白を除いて50文字まで（`too_long`）。空文字は未設定として扱う
          type: string

    UpdateHouseholdRequest:
      description: 送った項目だけを変更する。検証の規則は CreateHouseholdRequest と同じ
      type: object
      properties:
        name:
          type: string
        regionPrefecture:
          description: 空文字を送ると、未設定に戻す
          type: string
        regionCity:
          description: 空文字を送ると、未設定に戻す
          type: string

    Member:
      description: 世帯のメンバー
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          $ref: "#/components/schemas/DateTime"

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          description: "`editor` または `viewer`。それ以外（`owner` を含む）は `fields.role = invalid`"
          type: string

    TransferOwnershipRequest:
      type: object
      required: [userId]
      properties:
        userId:
          description: 新しいオーナー。自分自身なら `fields.userId = invalid`、世帯のメンバーでなければ `not_member`
          type: string
          format: uuid

    NotificationSettings:
      description: 世帯ごとの、自分の通知設定（要件15-3・16-3）
      type: object
      required: [reminderEnabled, reminderTime, completionNotifyEnabled]
      properties:
        reminderEnabled:
          description: リマインダーを受け取るか（初期値 true）
          type: boolean
        reminderTime:
          description: リマインダーを受け取る時刻（`HH:MM`、端末のタイムゾーン。初期値 `08:00`）。形式が違う場合は `fields.reminderTime = invalid`
          type: string
          examples: ["08:00"]
        completionNotifyEnabled:
          description: ほかのメンバーの完了通知を受け取るか（初期値 true）
          type: boolean

    Invitation:
      description: 世帯への招待
      type: object
      required: [id, role, code, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        code:
          description: アプリで手入力する8文字の招待コード（紛らわしい文字 0・O・1・I・L を含まない英大文字と数字）
          type: string
          examples: ["K7MP2QXA"]
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        createdAt:
          $ref: "#/components/schemas/DateTime"

    CreatedInvitation:
      description: 作成した招待。`url` を共有機能や QR コードで渡す
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [url]
          properties:
            url:
              description: 招待リンク（`https://<招待用ドメイン>/i/<トークン>`）
              type: string
              format: uri

    CreateInvitationRequest:
      type: object
      required: [role]
      properties:
        role:
          description: "`editor` または `viewer`。それ以外（`owner` を含む）は `fields.role = invalid`"
          type: string

    InvitationPreview:
      description: 参加の確認画面に表示する、招待の内容
      type: object
      required: [householdName, role, expiresAt, alreadyMember]
      properties:
        householdName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        alreadyMember:
          description: すでにこの世帯のメンバーなら true（参加済みであることを表示する。要件3-6）
          type: boolean

    Level:
      description: 程度。値は今後も追加されうるため、アプリは知らない値を「不明」として扱う
      type: string
      enum: [low, medium, high]

    WaterTendency:
      description: 水やりの量の傾向（`less`：乾かし気味、`moderate`：鉢土の表面が乾いたら、`more`：乾かさない）
      type: string
      enum: [less, moderate, more]

    Species:
      description: |
        植物マスタの1種類（全ユーザー共通）。性質の項目は、出典で確かめられたものだけを持つ。
        項目がない場合は「わからない」を表す（推測した値は入れない）
      type: object
      required: [id, nameJa, aliases]
      properties:
        id:
          type: string
          format: uuid
        nameJa:
          type: string
        scientificName:
          type: string
        aliases:
          type: array
          items:
            type: string
        lightLevel:
          $ref: "#/components/schemas/Level"
        minTempC:
          description: 冬越しの最低温度の目安（℃）
          type: number
          format: double
        humidityLevel:
          $ref: "#/components/schemas/Level"
        airflowNeed:
          $ref: "#/components/schemas/Level"
        waterTendency:
          $ref: "#/components/schemas/WaterTendency"
        outdoorOk:
          description: 春〜秋に屋外に出せるか
          type: boolean

    WindowDirection:
      description: 窓の向き（8方位）。屋外の場合は、その場所が面している向き。値は今後も追加されうるため、アプリは知らない値を「未設定」として扱う
      type: string
      enum: [n, ne, e, se, s, sw, w, nw]

    WindowDistance:
      description: 窓からの距離の目安（`near`：窓際、`middle`：窓から少し離れた所、`far`：部屋の奥）。値は今後も追加されうるため、アプリは知らない値を「未設定」として扱う
      type: string
      enum: [near, middle, far]

    Shading:
      description: 窓の遮光（`none`：遮光なし、`sheer`：レースカーテンなどで光を和らげている）。値は今後も追加されうるため、アプリは知らない値を「未設定」として扱う
      type: string
      enum: [none, sheer]

    Location:
      description: 置き場所。環境の項目は、未設定なら項目がない
      type: object
      required: [id, name, isIndoor, plantCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isIndoor:
          type: boolean
        windowDirection:
          $ref: "#/components/schemas/WindowDirection"
        windowDistance:
          $ref: "#/components/schemas/WindowDistance"
        shading:
          $ref: "#/components/schemas/Shading"
        plantCount:
          description: この置き場所にある植物の数（アーカイブしたものを除く）。削除の確認で示す
          type: integer
        createdAt:
          $ref: "#/components/schemas/DateTime"

    CreateLocationRequest:
      type: object
      required: [name]
      properties:
        name:
          description: 前後の空白を除いて1〜30文字。空の場合は `fields.name = required`、長すぎる場合は `too_long`
          type: string
        isIndoor:
          description: 省くと室内（`true`）
          type: boolean
        windowDirection:
          description: 任意。`WindowDirection` の値。空文字は未設定として扱う。知らない値は `fields.windowDirection = invalid`
          type: string
        windowDistance:
          description: 任意。`WindowDistance` の値。空文字は未設定として扱う。知らない値は `fields.windowDistance = invalid`
          type: string
        shading:
          description: 任意。`Shading` の値。空文字は未設定として扱う。知らない値は `fields.shading = invalid`
          type: string

    UpdateLocationRequest:
      description: 送った項目だけを変更する。検証の規則は CreateLocationRequest と同じ
      type: object
      properties:
        name:
          type: string
        isIndoor:
          type: boolean
        windowDirection:
          description: 空文字を送ると、未設定に戻す
          type: string
        windowDistance:
          description: 空文字を送ると、未設定に戻す
          type: string
        shading:
          description: 空文字を送ると、未設定に戻す
          type: string

    Plant:
      description: |
        世帯の植物。未設定の項目は、項目がない。
        種類は、植物マスタの種類（`speciesId`・`speciesName`）か、自由入力（`speciesFreeText`）のどちらか一方だけを持つ
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        speciesId:
          description: 植物マスタの種類の ID
          type: string
          format: uuid
        speciesName:
          description: 植物マスタの種類の和名（`speciesId` があるときだけ）
          type: string
        speciesFreeText:
          description: 植物マスタにない種類の自由入力
          type: string
        locationId:
          description: 置き場所の ID。置き場所を削除すると未設定になる
          type: string
          format: uuid
        acquiredOn:
          description: 購入日・お迎え日
          $ref: "#/components/schemas/Date"
        nextDueOn:
          description: 有効なタスク（一時停止・削除したものを除く）のうち、いちばん近い次回予定日（要件5-4）。タスクがなければ項目がない
          $ref: "#/components/schemas/Date"
        archivedAt:
          description: アーカイブした日時。アーカイブしていなければ項目がない
          $ref: "#/components/schemas/DateTime"
        createdAt:
          $ref: "#/components/schemas/DateTime"

    CreatePlantRequest:
      type: object
      required: [name]
      properties:
        name:
          description: 前後の空白を除いて1〜40文字。空の場合は `fields.name = required`、長すぎる場合は `too_long`
          type: string
        speciesId:
          description: |
            任意。植物マスタの種類の ID（`GET /species` で探す）。空文字は未設定として扱う。
            UUID でない、または存在しない場合は `fields.speciesId = invalid`
          type: string
        speciesFreeText:
          description: |
            任意。植物マスタにない種類の自由入力（要件6-3）。前後の空白を除いて50文字まで（長すぎる場合は `too_long`）。
            `speciesId` といっしょに送った場合は `fields.speciesFreeText = exclusive`
          type: string
        locationId:
          description: 任意。世帯の置き場所の ID。空文字は未設定として扱う。UUID でない、存在しない、ほかの世帯の置き場所の場合は `fields.locationId = invalid`
          type: string
        acquiredOn:
          description: 任意。購入日・お迎え日（`YYYY-MM-DD`）。空文字は未設定として扱う。形式が違う、存在しない日の場合は `fields.acquiredOn = invalid`
          type: string

    UpdatePlantRequest:
      description: |
        送った項目だけを変更する。検証の規則は CreatePlantRequest と同じ。
        種類は、`speciesId` か `speciesFreeText` のどちらかを送ると、まるごと置き換える（送らなかった方は消える）
      type: object
      properties:
        name:
          type: string
        speciesId:
          description: 空文字を送ると、種類を未設定に戻す
          type: string
        speciesFreeText:
          description: 空文字を送ると、種類を未設定に戻す
          type: string
        locationId:
          description: 空文字を送ると、未設定に戻す
          type: string
        acquiredOn:
          description: 空文字を送ると、未設定に戻す
          type: string

    CareKind:
      description: |
        お手入れの作業の種類（`watering`：水やり、`fertilizing`：肥料、`repotting`：植え替え、`pruning`：剪定、`other`：その他）。
        値は今後も追加されうるため、アプリは知らない値を「その他」として扱う
      type: string
      enum: [watering, fertilizing, repotting, pruning, other]

    IntervalUnit:
      description: 周期の単位
      type: string
      enum: [day, week, month]

    Interval:
      description: 'お手入れの周期（例：`{"value": 2, "unit": "week"}` は2週に1回）'
      type: object
      required: [value, unit]
      properties:
        value:
          type: integer
        unit:
          $ref: "#/components/schemas/IntervalUnit"

    SeasonalIntervals:
      description: 季節ごとの周期（要件8-6）。設定のない季節は、基本の周期（`interval`）を使う。季節は北半球で、春 3〜5月、夏 6〜8月、秋 9〜11月、冬 12〜2月
      type: object
      properties:
        spring: { $ref: "#/components/schemas/Interval" }
        summer: { $ref: "#/components/schemas/Interval" }
        autumn: { $ref: "#/components/schemas/Interval" }
        winter: { $ref: "#/components/schemas/Interval" }

    TaskStatus:
      description: タスクの状態（`active`：有効、`paused`：一時停止中）。値は今後も追加されうるため、アプリは知らない値を「有効」として扱う
      type: string
      enum: [active, paused]

    CareTask:
      description: 植物のお手入れタスク。未設定の項目は、項目がない
      type: object
      required: [id, plantId, kind, interval, seasonalIntervals, cycleSeq, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CareKind"
        customName:
          description: 作業名（`kind` が `other` のときだけ）
          type: string
        interval:
          $ref: "#/components/schemas/Interval"
        seasonalIntervals:
          $ref: "#/components/schemas/SeasonalIntervals"
        conditionText:
          description: 実行条件（例：土の表面が乾いていたら）
          type: string
        note:
          description: メモ（例：底から流れるまでたっぷり）
          type: string
        nextDueOn:
          description: 次回予定日。有効なタスクでは必ずある
          $ref: "#/components/schemas/Date"
        cycleSeq:
          description: 現在の予定の回の番号。完了・スキップのときに送り、同じ回の重複した完了を防ぐ
          type: integer
        status:
          $ref: "#/components/schemas/TaskStatus"
        createdAt:
          $ref: "#/components/schemas/DateTime"

    CareTaskDefault:
      description: タスクの作成画面の初期値（植物マスタのお手入れの目安から作る）
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/CareKind"
        conditionText:
          description: 実行条件の初期値
          type: string

    IntervalInput:
      description: 周期の入力。`value` は1以上で、`day` なら365、`week` なら52、`month` なら24まで
      type: object
      required: [value, unit]
      properties:
        value:
          type: integer
        unit:
          description: "`IntervalUnit` の値"
          type: string

    SeasonalIntervalsInput:
      description: 季節ごとの周期の入力。誤りは `fields` の `seasonalIntervals.<季節>` に入る
      type: object
      properties:
        spring: { $ref: "#/components/schemas/IntervalInput" }
        summer: { $ref: "#/components/schemas/IntervalInput" }
        autumn: { $ref: "#/components/schemas/IntervalInput" }
        winter: { $ref: "#/components/schemas/IntervalInput" }

    CreateCareTaskRequest:
      type: object
      required: [kind, interval]
      properties:
        kind:
          description: "`CareKind` の値。知らない値は `fields.kind = invalid`"
          type: string
        customName:
          description: "`kind` が `other` のとき必須（`fields.customName = required`）。前後の空白を除いて20文字まで（`too_long`）。ほかの種類では無視する"
          type: string
        interval:
          description: 基本の周期。範囲外・知らない単位は `fields.interval = invalid`
          $ref: "#/components/schemas/IntervalInput"
        seasonalIntervals:
          $ref: "#/components/schemas/SeasonalIntervalsInput"
        conditionText:
          description: 任意。実行条件。100文字まで（`too_long`）
          type: string
        note:
          description: 任意。メモ。200文字まで（`too_long`）
          type: string
        nextDueOn:
          description: 任意。初回の予定日（`YYYY-MM-DD`）。省くと、世帯のタイムゾーンでの今日にする。形式が違う場合は `fields.nextDueOn = invalid`
          type: string

    UpdateCareTaskRequest:
      description: 送った項目だけを変更する。検証の規則は CreateCareTaskRequest と同じ
      type: object
      properties:
        customName:
          description: "`kind` が `other` のタスクだけで変えられる（ほかの種類では無視する）"
          type: string
        interval:
          $ref: "#/components/schemas/IntervalInput"
        seasonalIntervals:
          description: 季節ごとの周期をまるごと置き換える。`{}` を送ると、季節ごとの周期をなくす
          $ref: "#/components/schemas/SeasonalIntervalsInput"
        conditionText:
          description: 空文字を送ると、実行条件をなくす
          type: string
        note:
          description: 空文字を送ると、メモをなくす
          type: string
        nextDueOn:
          description: 次回予定日（`YYYY-MM-DD`）。空にはできない（`fields.nextDueOn = required`）
          type: string

    Platform:
      description: 端末の OS の種類。値は今後も追加されうるため、アプリは知らない値を無視する
      type: string
      enum: [ios, android]

    RegisterDeviceRequest:
      type: object
      required: [fcmToken, platform, timeZone]
      properties:
        fcmToken:
          description: FCM の登録トークン。空の場合は `fields.fcmToken = required`、長すぎる場合は `too_long`
          type: string
        platform:
          description: 知らない値の場合は `fields.platform = invalid`
          type: string
        timeZone:
          description: 端末の IANA タイムゾーン（`Asia/Tokyo` など）。リマインダーの日付と時刻の判定に使う。不明な名前の場合は `fields.timeZone = invalid`
          type: string
          examples: ["Asia/Tokyo"]

    Device:
      description: プッシュ通知の送信先となる端末
      type: object
      required: [id, platform, timeZone, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        timeZone:
          type: string
        lastSeenAt:
          description: 最後に登録・更新した日時
          $ref: "#/components/schemas/DateTime"

    Date:
      description: 日付（`YYYY-MM-DD`）。世帯の地域や端末のタイムゾーンにおける暦の日付を表す
      type: string
      format: date
      examples: ["2026-10-26"]

    DateTime:
      description: 日時（RFC 3339）。サーバーは常に UTC（末尾が `Z`）で返す
      type: string
      format: date-time
      examples: ["2026-10-26T09:30:00Z"]

    ErrorCode:
      description: |
        エラーの種類。アプリはこの値で分岐する。値は今後も追加されるため、知らない値は「不明なエラー」として扱う。

        | code | HTTP | 意味 |
        |---|---|---|
        | `bad_request` | 400 | リクエストの形式の誤り（JSON として読めない、パラメーターの型が違う、など） |
        | `validation_failed` | 422 | 入力の内容の誤り。`fields` に入力欄ごとの理由が入る |
        | `unauthenticated` | 401 | ID トークンがない・無効・期限切れ |
        | `forbidden` | 403 | 世帯のメンバーだが、ロールが操作を許可していない |
        | `not_found` | 404 | 存在しない、または所属していない世帯のデータ（存在を明かさない） |
        | `conflict` | 409 | 状態の衝突（個別の code がない場合） |
        | `last_owner` | 409 | 唯一のオーナーのため、退出・ロールの変更ができない（先にオーナー権限を移す） |
        | `already_member` | 409 | すでに世帯のメンバーである（招待の参加） |
        | `invitation_invalid` | 410 | 招待が期限切れ・取り消し済み・存在しない |
        | `rate_limited` | 429 | 短い時間にリクエストが多すぎる。`Retry-After` ヘッダーの秒数だけ待ってから送り直す |
        | `internal` | 500 | サーバーの障害 |
      type: string
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - last_owner
        - already_member
        - invitation_invalid
        - rate_limited
        - internal

    Error:
      description: |
        すべてのエラーレスポンスの共通の形。
        エラーの種類によっては、衝突の内容（誰がいつ完了したか、など）の項目が追加される。
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          description: 開発者向けの説明（英語）。画面には表示せず、表示する文言は `code` から i18n で引く
          type: string
        fields:
          description: |
            入力欄ごとのエラーの理由（`validation_failed` のとき）。キーは項目名、値は理由のコード（`required`、`too_long` など）
          type: object
          additionalProperties:
            type: string
          examples:
            - { name: required }

  responses:
    BadRequest:
      description: リクエストの形式の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 認証が必要
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 権限がない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状態の衝突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: 入力の内容の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: 招待が無効（期限切れ・取り消し済み・存在しない）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: リクエストが多すぎる
      headers:
        Retry-After:
          description: 送り直すまでに待つ秒数
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: サーバーの障害
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
