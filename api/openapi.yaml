# uchinokusa の API 定義。サーバーとアプリの取り決めの唯一の正（docs/decisions/0001）。
# 変更したら、リポジトリのルートで `make gen-api` を実行して、両方の型を生成し直す。
openapi: 3.1.0
info:
  title: uchinokusa API
  version: 0.1.0
  description: |
    家族で共有できる室内観葉植物の管理アプリ（uchinokusa）の API。

    ## 表現のルール
    - JSON の項目名はキャメルケースとする
    - 日付は `YYYY-MM-DD`（`Date`）、日時は RFC 3339 の UTC（`DateTime`、例：`2026-10-26T09:30:00Z`）とする
    - エラーは、どのステータスでも `Error` の形で返す。アプリは `code` で分岐し、`message` は画面に表示しない

    ## 互換性のルール（要件19-9）
    - この定義には、項目・列挙値・エンドポイントの**追加だけ**を行う。削除や意味の変更は `/v2` で行う
    - アプリは、知らない項目を無視する。知らない列挙値（エラーの `code` を含む）は「不明」として扱い、エラーにしない
    - そのため、レスポンスのスキーマには `additionalProperties: false` を付けない
    - サーバーも、リクエストの知らない項目を無視する（新しいアプリから古いサーバーへのリクエストを受け付けるため）

servers:
  - url: /v1

# すべてのエンドポイントで、Firebase の ID トークンが必要（要件1-3）
security:
  - firebaseIdToken: []

paths:
  /me:
    get:
      operationId: getMe
      summary: 自分のプロフィールを取得する
      description: 初めてアクセスしたユーザーの場合は、認証プロバイダから受け取った名前を表示名の初期値にして、ユーザーを作る
      tags: [account]
      responses:
        "200":
          description: 自分のプロフィール
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: updateMe
      summary: 自分の表示名を変更する
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: 変更後のプロフィール
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /me/devices:
    post:
      operationId: registerDevice
      summary: プッシュ通知の送信先となる端末を登録・更新する
      description: |
        アプリの起動時と、FCM トークンが変わったときに呼ぶ。同じ `fcmToken` の端末がすでにあれば、
        その端末の OS の種類・タイムゾーンを更新する（要件15-7）。
        別のユーザーで登録されていた場合は、リクエストしたユーザーの端末に付け替える（1台の端末で、ユーザーを切り替えた場合）。
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "200":
          description: 登録・更新した端末。`id` はサインアウト時の解除に使うため、アプリに保存する
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /me/devices/{deviceId}:
    delete:
      operationId: unregisterDevice
      summary: 端末をプッシュ通知の送信先から外す
      description: |
        サインアウトの前に呼ぶ（要件1-5）。自分の端末でない場合や、すでに外れている場合も 204 を返す
        （サインアウトを止めないため。ほかのユーザーの端末の有無も明かさない）。
      tags: [account]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 外した（または、もともと送信先ではなかった）
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    firebaseIdToken:
      description: "Firebase Auth の ID トークン（`Authorization: Bearer <トークン>`）。期限が切れたら、アプリで更新して送り直す"
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Me:
      description: 自分のプロフィール
      type: object
      required: [id, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          description: 世帯のメンバーに表示する名前。認証プロバイダから名前を受け取れなかった場合は空文字になる（アプリで設定を促す）
          type: string
        createdAt:
          $ref: "#/components/schemas/DateTime"

    UpdateMeRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          description: 前後の空白を除いて1〜30文字。空の場合は `fields.displayName = required`、長すぎる場合は `too_long`
          type: string

    Platform:
      description: 端末の OS の種類。値は今後も追加されうるため、アプリは知らない値を無視する
      type: string
      enum: [ios, android]

    RegisterDeviceRequest:
      type: object
      required: [fcmToken, platform, timeZone]
      properties:
        fcmToken:
          description: FCM の登録トークン。空の場合は `fields.fcmToken = required`、長すぎる場合は `too_long`
          type: string
        platform:
          description: 知らない値の場合は `fields.platform = invalid`
          type: string
        timeZone:
          description: 端末の IANA タイムゾーン（`Asia/Tokyo` など）。リマインダーの日付と時刻の判定に使う。不明な名前の場合は `fields.timeZone = invalid`
          type: string
          examples: ["Asia/Tokyo"]

    Device:
      description: プッシュ通知の送信先となる端末
      type: object
      required: [id, platform, timeZone, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/Platform"
        timeZone:
          type: string
        lastSeenAt:
          description: 最後に登録・更新した日時
          $ref: "#/components/schemas/DateTime"

    Date:
      description: 日付（`YYYY-MM-DD`）。世帯の地域や端末のタイムゾーンにおける暦の日付を表す
      type: string
      format: date
      examples: ["2026-10-26"]

    DateTime:
      description: 日時（RFC 3339）。サーバーは常に UTC（末尾が `Z`）で返す
      type: string
      format: date-time
      examples: ["2026-10-26T09:30:00Z"]

    ErrorCode:
      description: |
        エラーの種類。アプリはこの値で分岐する。値は今後も追加されるため、知らない値は「不明なエラー」として扱う。

        | code | HTTP | 意味 |
        |---|---|---|
        | `bad_request` | 400 | リクエストの形式の誤り（JSON として読めない、パラメーターの型が違う、など） |
        | `validation_failed` | 422 | 入力の内容の誤り。`fields` に入力欄ごとの理由が入る |
        | `unauthenticated` | 401 | ID トークンがない・無効・期限切れ |
        | `forbidden` | 403 | 世帯のメンバーだが、ロールが操作を許可していない |
        | `not_found` | 404 | 存在しない、または所属していない世帯のデータ（存在を明かさない） |
        | `conflict` | 409 | 状態の衝突（個別の code がない場合） |
        | `internal` | 500 | サーバーの障害 |
      type: string
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - internal

    Error:
      description: |
        すべてのエラーレスポンスの共通の形。
        エラーの種類によっては、衝突の内容（誰がいつ完了したか、など）の項目が追加される。
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          description: 開発者向けの説明（英語）。画面には表示せず、表示する文言は `code` から i18n で引く
          type: string
        fields:
          description: |
            入力欄ごとのエラーの理由（`validation_failed` のとき）。キーは項目名、値は理由のコード（`required`、`too_long` など）
          type: object
          additionalProperties:
            type: string
          examples:
            - { name: required }

  responses:
    BadRequest:
      description: リクエストの形式の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 認証が必要
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 権限がない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 見つからない
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 状態の衝突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: 入力の内容の誤り
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: サーバーの障害
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
