# ローカル開発用のサービス。起動：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uchinokusa
      POSTGRES_PASSWORD: uchinokusa
      POSTGRES_DB: uchinokusa
    ports:
      # ホストのポートは 54320 にする（Mac に直接入れた PostgreSQL の 5432 とぶつからないように）
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uchinokusa -d uchinokusa"]
      interval: 5s
      timeout: 3s
      retries: 10

  firebase-auth:
    build: ./dev/firebase-emulator
    ports:
      - "9099:9099"

volumes:
  postgres-data:
