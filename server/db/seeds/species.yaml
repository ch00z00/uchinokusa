# 植物マスタの初期データ（全ユーザー共通）。`uchinokusa seed` で投入する（docs/decisions/0015）。
#
# 決まり（`seed` の前に検証し、守られていなければ投入しない）
# - 性質（light_level など）・水やり・植え替えの適期は、出典で確かめられた値だけを入れる。わからなければ書かない
#   （園芸の値を推測で入れない。docs/decisions/0009）
# - 値を入れた項目は、どれかの出典の fields に挙げる。quote には、値の根拠になった文を書く
# - slug は投入のキーなので、一度決めたら変えない（変えると別の種類として追加される）
#
# 値の決め方（出典の文 → 値）
# - light_level：「日当たりのよい場所」「日光によく当てる」→ high、「半日陰」「明るい日陰」→ medium、「日陰で育てる」→ low
# - humidity_level：「多湿を好む」→ high
# - airflow_need：「風通しのよい場所に置く」→ high
# - water_tendency：「乾かし気味に管理」→ less、「鉢土の表面が乾いたら」→ moderate、「乾かさない」→ more
# - outdoor_ok：「春から秋は戸外に置ける」→ true
# - repotting_suitable_months：適期の月。「5月中旬から」のように月の途中から始まる場合も、その月を含める
#   避ける時期は出典に書かれていないことが多いため、既定値（真夏・真冬）から適期の月を除いたものを使う

# --- 性質を出典で確かめた種類（出典：みんなの趣味の園芸 植物図鑑、NHK出版） ---

- slug: monstera-deliciosa
  name_ja: モンステラ
  scientific_name: Monstera deliciosa
  aliases: [ホウライショウ, デンシンラン, ペッサム]
  light_level: high
  airflow_need: high
  water_tendency: moderate
  outdoor_ok: true
  watering:
    condition: 鉢土の表面が乾いてきたら
  repotting_suitable_months: [5, 6, 7, 8, 9]
  sources:
    - url: https://www.shuminoengei.jp/m-pc/a-page_p_detail/target_plant_code-79/target_tab-2
      title: モンステラの育て方・栽培方法｜植物図鑑｜みんなの趣味の園芸（NHK出版）
      accessed_on: 2026-11-03
      fields: [light_level, airflow_need, water_tendency, outdoor_ok, watering, repotting]
      quote: >-
        できるだけ日光に当てたほうが、しっかりした株に育ちます。／風通しのよい場所に置き、／
        年間を通して鉢土の表面が乾いてきたら水を与えれば十分です。／
        春から秋に戸外やベランダなどに置いた株は、冬は室内に取り込みます。／5月から9月に植え替えます。

- slug: epipremnum-aureum
  name_ja: ポトス
  scientific_name: Epipremnum pinnatum 'Aureum'
  aliases: [オウゴンカズラ, エピプレムナム]
  light_level: medium
  humidity_level: high
  water_tendency: moderate
  outdoor_ok: true
  watering:
    condition: 鉢土の表面が乾いてきたら
    winter: 乾かし気味に管理する
  repotting_suitable_months: [5, 6, 7, 8]
  sources:
    - url: https://www.shuminoengei.jp/m-pc/a-page_p_detail/target_plant_code-78/target_tab-2
      title: ポトスの育て方・栽培方法｜植物図鑑｜みんなの趣味の園芸（NHK出版）
      accessed_on: 2026-11-03
      fields: [light_level, humidity_level, water_tendency, outdoor_ok, watering, repotting]
      quote: >-
        春から秋までは半日陰に置き、冬は光線によく当てます。／多湿を好むので、年間を通してこまめに葉水を与えます。／
        鉢土の表面が乾いてきたら水を与えます。冬は乾かし気味に管理します。／
        春から秋に戸外やベランダなどに置いた株は、冬は室内に取り込みます。／5月中旬から8月に行います。

- slug: sansevieria
  name_ja: サンセベリア
  scientific_name: Sansevieria
  aliases: [サンスベリア, トラノオ, チトセラン]
  light_level: high
  airflow_need: high
  water_tendency: less
  outdoor_ok: true
  watering:
    condition: 鉢土が乾いたら
    winter: 鉢土を乾燥させ、休眠させる（トリファスキアタの園芸品種）
  repotting_suitable_months: [5, 6, 7, 8]
  sources:
    - url: https://www.shuminoengei.jp/m-pc/a-page_p_detail/target_plant_code-75/target_tab-2
      title: サンセベリアの育て方・栽培方法｜植物図鑑｜みんなの趣味の園芸（NHK出版）
      accessed_on: 2026-11-03
      fields: [light_level, airflow_need, water_tendency, outdoor_ok, watering, repotting]
      quote: >-
        できるだけ日当たりのよい場所に置き、乾かし気味に管理します。／風通しのよい場所に置き、／
        春から秋は、鉢土が乾いたら水を与えます。／冬は、トリファスキアタの園芸品種は鉢土を乾燥させ、休眠状態にします。／
        春から秋に戸外やベランダなどに置いた株は、冬は室内に取り込みます。／毎年5月中旬から8月に植え替えます。

