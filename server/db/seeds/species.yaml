- slug: ficus-microcarpa
  name_ja: ガジュマル
  scientific_name: Ficus microcarpa
  light_level: high
  min_temp_c: 5
  water_tendency: moderate
  outdoor_ok: true
  watering:
    condition: 鉢土の表面が乾いてから
  repotting_suitable_months: [5, 6, 7, 8, 9]
  sources:
    - url: https://www.shuminoengei.jp/m-pc/a-page_p_detail/target_plant_code-1045/target_tab-2
      title: ガジュマルの育て方・栽培方法｜植物図鑑｜みんなの趣味の園芸（NHK出版）
      accessed_on: 2026-11-03
      fields: [light_level, min_temp_c, water_tendency, outdoor_ok, watering, repotting]
      quote: >-
        春から秋は屋外の日当たりのよい場所で育てるのが理想的です。／冬は室内の明るい場所で5℃以上保つようにしてください。／
        鉢土の表面が乾いてから水やりします。／小鉢は1～2年に1回、大鉢は2～3年に1回、5月から9月に植え替えてください。

